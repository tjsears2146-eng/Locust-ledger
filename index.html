  function quantity(value,label='Quantity') {

  function renderSale() {

  }
  function addToCart(productId) {
    const product=state.products.find(p=>p.id===productId&&!p.archived);
    if(!product||product.quantity<=0) throw new Error('This item is unavailable or out of stock.');
    const existing=cart.find(l=>l.productId===productId);
    const inCart=cart.filter(l=>l.productId===productId).reduce((sum,l)=>sum+Number(l.quantity),0);
    if(inCart>=product.quantity) throw new Error('All available units are already in this sale.');
    if(existing) existing.quantity=Number(existing.quantity)+1;
    else cart.push({key:C.id('draft'),productId:product.id,productName:product.name,ownerId:product.ownerId,quantity:1,unitPrice:decimal(product.priceCents),unitCost:decimal(product.costCents),discount:'0',taxCategory:product.taxCategory});
    persistDraft();
    if(view!=='sale') navigate('sale'); else render();
    $('#sale-search')?.focus();
  }

</tr>').join('')+'</tbody></table></div>':empty('No inventory losses','Damaged, missing, and discarded items can be recorded at their cost.'))+'</section>';
  }

  function renderTrend(ownerId) {
    const current=C.today().split('-').map(Number);
    const rows=Array.from({length:6},(_,index)=>{
      const d=new Date(current[0],current[1]-6+index,1),y=d.getFullYear(),m=d.getMonth()+1;
      const from=y+'-'+String(m).padStart(2,'0')+'-01';
      const to=y+'-'+String(m).padStart(2,'0')+'-'+new Date(y,m,0).getDate();
      const s=C.summarize(state,{from,to,ownerId});

      const canvas=document.createElement('canvas'),scale=Math.min(1,1600/Math.max(image.width,image.height));
      canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);

    else if(action==='label') labelModal(id);
    else if(action==='batch-labels') batchLabelModal();
    else if(action==='print-label') Labels.print([{product:state.products.find(p=>p.id===id),copies:quantity($('#f-label-copies').value)}],state.settings);
    else if(action==='save-label') Labels.exportPNG(state.products.find(p=>p.id===id),state.settings);
    else if(action==='share-label') await shareLabel(id);
    else if(action==='tax-payment') taxPaymentModal();
    else if(action==='reserve-payment') reservePaymentModal(node.dataset.owner||'business');
    else if(action==='new-tax-category') openModal('Add tax category','<div class="form-grid">'+field('tax-new-name','Category name','','text','required maxlength="80"')+field('tax-new-rate','Verified combined rate (%)','','text','inputmode="decimal" required')+'</div>','tax-category','','Add category');
    else if(action==='archive-product'||action==='restore-product') await commit(next=>{const p=next.products.find(p=>p.id===id);p.archived=action==='archive-product';audit(next,p.archived?'Product archived':'Product restored',p.name);},action==='archive-product'?'Item archived. History and stock remain recorded.':'Item restored.');
    else if(action==='archive-person'||action==='restore-person') {
      if(action==='archive-person') {
        if(state.products.some(p=>p.ownerId===id&&p.quantity>0)) throw new Error('This person still owns stock. Resolve or transfer that inventory before archiving.');
        if(C.summarize(state,{ownerId:id}).balanceCents!==0) throw new Error('Settle this person’s proceeds balance before archiving.');
      }
      await commit(next=>{const person=next.people.find(p=>p.id===id);person.archived=action==='archive-person';audit(next,person.archived?'Person archived':'Person restored',person.name);},action==='archive-person'?'Person archived. Their history is retained.':'Person restored.');
    }
    else if(action==='backup') await backup();
    else if(action==='import') {$('#import-file').value='';$('#import-file').click();}
    else if(action==='confirm-import') {
      if(!pendingImport) throw new Error('Choose a backup file first.');
      const imported=clone(pendingImport);
      await backup();
      const result=await commit(next=>{Object.keys(next).forEach(key=>delete next[key]);Object.assign(next,imported);audit(next,'Backup restored','Imported existing records from a JSON backup.');},'Backup restored.');
      if(result) {pendingImport=null;cart=[];labelSelection.clear();persistDraft();navigate('dashboard');}
    }
    else if(action==='export-inventory') exportInventory();
    else if(action==='export-sales') exportSales();
    else if(action==='export-summary') exportSummary();
    else if(action==='audit') auditModal();
  }
  document.addEventListener('click',async event=>{
    const node=event.target.closest('[data-action],[data-view],#backup-button');
    if(!node||!state) return;
    try {
      if(node.dataset.view) navigate(node.dataset.view);
      else await handleAction(node.id==='backup-button'?'backup':node.dataset.action,node);
    } catch(error) {formError(error);}
  });
  document.addEventListener('submit',async event=>{
    const form=event.target.closest('form[data-form]');
    if(!form) return;
    event.preventDefault();
    if(!form.checkValidity()) {form.reportValidity();return;}
    try {await handleSubmit(form);} catch(error) {formError(error);}
  });
  document.addEventListener('input',event=>{
    const input=event.target;
    if(input.id==='sale-search') {saleSearch=input.value;$('#sale-product-results').innerHTML=saleProducts();}
    if(input.dataset.sale) {saleDetails[input.dataset.sale]=input.value;persistDraft();if(input.dataset.sale==='fee'||input.dataset.sale==='date')updateSalePreview();}
    if(input.dataset.cart) {const line=cart[Number(input.dataset.index)];if(line){line[input.dataset.cart]=input.value;persistDraft();updateSalePreview();}}
    if(input.id==='inventory-search') {
      inventorySearch=input.value;
      const position=input.selectionStart;render();const replacement=$('#inventory-search');replacement.focus();try{replacement.setSelectionRange(position,position);}catch(_){}
    }
  });
  document.addEventListener('change',async event=>{
    const input=event.target;
    try {
      if(input.id==='inventory-owner') {inventoryOwner=input.value;render();}
      else if(input.id==='inventory-status') {inventoryStatus=input.value;render();}
      else if(input.id==='expense-owner') {expenseOwner=input.value;render();}
      else if(input.id==='report-owner') {reportOwner=input.value;render();}
      else if(input.id==='report-period') {reportPeriod=input.value;render();}
      else if(input.dataset.reportDate) {if(input.dataset.reportDate==='from')reportFrom=input.value;else reportTo=input.value;if(reportFrom&&reportTo&&reportFrom>reportTo){if(input.dataset.reportDate==='from'){reportFrom=reportTo;input.value=reportFrom;}else{reportTo=reportFrom;input.value=reportTo;}throw new Error('The start date must be on or before the end date. The range has been adjusted.');}render();}
      else if(input.dataset.cart) {const line=cart[Number(input.dataset.index)];if(line)line[input.dataset.cart]=input.value;persistDraft();updateSalePreview();}
      else if(input.dataset.sale) {saleDetails[input.dataset.sale]=input.value;persistDraft();updateSalePreview();}
      else if(input.dataset.labelSelect) {if(input.checked)labelSelection.add(input.dataset.labelSelect);else labelSelection.delete(input.dataset.labelSelect);if($('#label-count'))$('#label-count').textContent=labelSelection.size;}
      else if(input.id==='select-all-labels') {$$('[data-label-select]').forEach(box=>{box.checked=input.checked;if(input.checked)labelSelection.add(box.dataset.labelSelect);else labelSelection.delete(box.dataset.labelSelect);});if($('#label-count'))$('#label-count').textContent=labelSelection.size;}
      else if(input.id==='scan-image') await scanImage(input.files[0]);
      else if(input.id==='import-file') await prepareImport(input.files[0]);
      else if(input.id==='f-person-type'&&input.value==='partner'&&!$('#modal form').dataset.id) $('#f-person-commission').value='0.00';
    } catch(error) {formError(error);}
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&(event.target.id==='sale-search'||event.target.id==='scan-code')) {
      event.preventDefault();
      try {useScan(event.target.value);} catch(error) {toast(error.message,true);}
    }
    if(event.key==='Escape') stopCamera();
  });
  $('#modal').addEventListener('cancel',event=>{event.preventDefault();productReturnDraft=null;pendingImport=null;closeModal();});
  $('#modal').addEventListener('close',stopCamera);
  window.addEventListener('pagehide',stopCamera);
  window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(views[next]){view=next;render();}});
  async function start() {
    try {
      state=await DB.load();meta=await DB.meta()||{};
      if(!state) {state=C.defaultState();state.revision=0;await DB.save(state,0);}
      C.validateState(state);
      saleDetails.date=C.today();
      try {const draft=JSON.parse(sessionStorage.getItem('locust-ledger-draft:'+location.pathname));if(draft&&Array.isArray(draft.cart)&&draft.cart.length<500){cart=draft.cart;saleDetails={...saleDetails,...draft.saleDetails};}} catch(_) {}
      const hash=location.hash.slice(1);if(views[hash])view=hash;
      if('BroadcastChannel' in window) {
        channel=new BroadcastChannel('locust-ledger:'+location.pathname);
        channel.onmessage=async()=>{
          if(busy) return;
          try {const latest=await DB.load();if(latest&&latest.revision>state.revision){C.validateState(latest);state=latest;render();toast('Records refreshed from another tab. Recheck any form you have open.');}} catch(error) {toast(error.message,true);}
        };
      }
      render();
      if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(()=>{});
    } catch(error) {
      $('#save-status').textContent='Local storage unavailable';
      $('#view-content').innerHTML='<section class="card"><div class="card-body"><h2>Your records could not be opened</h2><p>'+escape(error.message)+'</p><p>Try a regular browser window with storage enabled. Do not clear existing browser data if it contains records you need.</p></div></section>';
    }
  }
  start();
})();

</script>
</body>
</html>
